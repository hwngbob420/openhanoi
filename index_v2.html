<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hà Nội Pixel Map</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #1b1d23; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  #hud { position: fixed; left: 10px; top: 10px; font: 12px/1.45 ui-monospace, Consolas, monospace; color: #e8e4d8;
         background: rgba(14, 15, 19, .72); padding: 7px 10px; border-radius: 4px; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">loading…</div>
<script>
'use strict';
// ───────────────────────── config (assets2: Codex elements + Muse tileset) ─────────────────────────
const ROOT = new URLSearchParams(location.search).get('a') || 'assets2';
const N = 44;
const XR = [[7, 9], [18, 20], [29, 31], [40, 42]];      // east-west roads (3 rows, middle row = lane line)
const YR = [[11, 13], [26, 28], [41, 43]];              // north-south roads (3 cols)
const BX = [[0, 9], [15, 24], [30, 39]];                // block column ranges
const BY = [[0, 5], [11, 16], [22, 27], [33, 38]];      // block row ranges (two back-to-back rows of houses)
const LAKE = { x0: 30, x1: 43, y0: 0, y1: 9 };
const PLAZA = { x0: 15, x1: 24, y0: 11, y1: 16 };
const RAIL = { row: 19, x1: 13 };                       // train street: rail on row 19, café strips on rows 17-18 and 20-21
const ROAD_SPAN = { x: { 7: [0, 29] }, y: { 41: [11, 43] } };   // roads that stop at the lake
const MOTO = ['red', 'blue', 'delivery', 'woman', 'family', 'flowers', 'rain', 'bicycle'];
const TOD_TINT = ['#ffffff', '#f0b98c', '#5a6aa8'];

let TW = 108, TH = 54;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hud = document.getElementById('hud');
const cam = { x: 0, y: 0, zoom: 1 };
let tod = 0;
const stats = { sprites: 0, spritesWanted: 0, objects: 0, vehicles: 0, cables: 0, poles: 0, buildings: 0, fps: 0, errors: [], missingTiles: [] };
window.__stats = stats;

// ───────────────────────── utils ─────────────────────────
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const R = rng(20261111);
const pick = (a) => a[Math.floor(R() * a.length)];
const rr = (a, b) => a + R() * (b - a);
const proj = (gx, gy) => [(gx - gy) * TW / 2, (gx + gy) * TH / 2];
function loadImg(src) { return new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => { stats.errors.push('img ' + src); res(null); }; i.src = src; }); }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; }
function px(x, X, Y, w, h, col) { x.fillStyle = col; x.fillRect(X, Y, w, h); }

// ───────────────────────── assets ─────────────────────────
const A = { tiles: {}, spr: {}, man: null };
async function loadAssets() {
  const man = await (await fetch(`${ROOT}/manifest.json?${Date.now()}`)).json(); A.man = man;
  TW = man.tile.w; TH = man.tile.h;
  const tl = await (await fetch(`${ROOT}/tiles/tiles.json?${Date.now()}`)).json();
  await Promise.all(tl.order.map(async (n) => { A.tiles[n] = await loadImg(`${ROOT}/tiles/${n}.png`); }));
  const ids = Object.keys(man.sprites); stats.spritesWanted = ids.length;
  await Promise.all(ids.map(async (id) => { const im = await loadImg(`${ROOT}/` + man.sprites[id].file); if (im) { A.spr[id] = im; stats.sprites++; } }));
}
const has = (id) => !!A.spr[id];
const tile = (n) => { const t = A.tiles[n]; if (!t && !stats.missingTiles.includes(n)) stats.missingTiles.push(n); return t || A.tiles.road; };
function buildingGroups() {
  const g = {};
  for (const [id, s] of Object.entries(A.man.sprites)) if (s.kind === 'building' && has(id)) (g[s.group] ||= {})[s.facing] = id;
  return Object.entries(g).filter(([, v]) => v.front_L && v.back_L).map(([k, v]) => ({ name: k, front: v.front_L, back: v.back_L }));
}

// ───────────────────────── world ─────────────────────────
const W = { ground: [], occ: [], objs: [], cables: [], vehicles: [], poles: [], train: null };
const inR = (v, r) => v >= r[0] && v <= r[1];
const inRect = (x, y, r) => x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y1;
function roadKind(x, y) {
  if (inRect(x, y, LAKE)) return null;
  const xr = XR.find((r) => inR(y, r)), yr = YR.find((r) => inR(x, r));
  if (xr && yr) return 'int'; if (xr) return y === xr[0] + 1 ? 'xmid' : 'x'; if (yr) return x === yr[0] + 1 ? 'ymid' : 'y'; return null;
}
const isRoad = (x, y) => x >= 0 && y >= 0 && x < N && y < N && roadKind(x, y) !== null;
const trainAlley = (x, y) => x <= RAIL.x1 && y >= RAIL.row - 2 && y <= RAIL.row + 2;

function genGround() {
  for (let y = 0; y < N; y++) { W.ground[y] = []; W.occ[y] = []; for (let x = 0; x < N; x++) W.occ[y][x] = false; }
  const sidewalk = (x, y) => !isRoad(x, y) && !inRect(x, y, LAKE) && (isRoad(x + 1, y) || isRoad(x - 1, y) || isRoad(x, y + 1) || isRoad(x, y - 1));
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const k = roadKind(x, y); let t;
    if (k === 'xmid') t = 'road_lane_x'; else if (k === 'ymid') t = 'road_lane_y';
    else if (k === 'int') t = (x === YR.find((r) => inR(x, r))[0] + 1 && y === XR.find((r) => inR(y, r))[0] + 1) ? 'road_cross' : 'road';
    else if (k) t = R() < .014 ? 'road_patch' : R() < .012 ? 'road_drain' : 'road';
    else if (sidewalk(x, y)) {
      const rx = isRoad(x + 1, y), ry = isRoad(x, y + 1), mx = isRoad(x - 1, y), my = isRoad(x, y - 1);
      t = (rx && ry) ? 'kerb_corner_ll_lr' : rx ? 'kerb_lr' : ry ? 'kerb_ll' : mx ? 'kerb_ul' : my ? 'kerb_ur' : 'sidewalk';
    } else t = R() < .08 ? 'alley_stain' : 'alley_concrete';
    W.ground[y][x] = t;
  }
  // zebra crossings on the road arms next to every junction
  for (const yr of YR) for (const xr of XR) {
    for (let y = xr[0]; y <= xr[1]; y++) for (const x of [yr[0] - 2, yr[1] + 2]) if (x >= 0 && x < N && roadKind(x, y) && !inRect(x, y, LAKE)) W.ground[y][x] = 'crosswalk_x';
    for (let x = yr[0]; x <= yr[1]; x++) for (const y of [xr[0] - 2, xr[1] + 2]) if (y >= 0 && y < N && roadKind(x, y) && !inRect(x, y, LAKE)) W.ground[y][x] = 'crosswalk_y';
  }
  // train street: rail on row 19, café strips either side, the rail runs on over the y-road
  for (let x = 0; x <= RAIL.x1; x++) {
    W.ground[RAIL.row][x] = 'rail_x';
    if (x < YR[0][0]) for (const y of [17, 18, 20, 21]) W.ground[y][x] = 'alley_concrete';
  }
  // plaza: brick with the odd manhole / drain
  for (let y = PLAZA.y0; y <= PLAZA.y1; y++) for (let x = PLAZA.x0; x <= PLAZA.x1; x++) {
    W.ground[y][x] = R() < .05 ? 'brick_manhole' : R() < .05 ? 'brick_drain' : R() < .09 ? 'brick_damp' : 'brick'; W.occ[y][x] = true; }
  // lake
  const L = LAKE;
  for (let y = L.y0; y <= L.y1; y++) for (let x = L.x0; x <= L.x1; x++) { W.ground[y][x] = R() < .25 ? 'grass_dark' : 'grass'; W.occ[y][x] = true; }
  const wx0 = L.x0 + 2, wx1 = L.x1 - 2, wy0 = L.y0 + 2, wy1 = L.y1 - 2;
  for (let y = L.y0 + 1; y <= L.y1 - 1; y++) for (let x = L.x0 + 1; x <= L.x1 - 1; x++) W.ground[y][x] = 'brick';        // promenade ring
  const water = (x, y) => x >= wx0 && x <= wx1 && y >= wy0 && y <= wy1 && !((x === wx0 || x === wx1) && (y === wy0 || y === wy1));
  for (let y = wy0; y <= wy1; y++) for (let x = wx0; x <= wx1; x++) if (water(x, y)) {
    let t = R() < .08 ? 'water_lily' : R() < .1 ? 'water_glint' : 'water';
    if (!water(x, y - 1)) t = 'shore_ur'; else if (!water(x + 1, y)) t = 'shore_lr'; else if (!water(x, y + 1)) t = 'shore_ll'; else if (!water(x - 1, y)) t = 'shore_ul';
    W.ground[y][x] = t; }
  for (const [x, y] of [[36, 4], [37, 4], [36, 5], [37, 5]]) W.ground[y][x] = 'grass';        // Turtle Tower island
}

function addObj(o) { W.objs.push(o); return o; }
function placeBuilding(g, facing, gx, gy) {
  const id = facing === 'front' ? g.front : g.back; const m = A.man.sprites[id]; const [w, d] = m.fp;
  for (let y = gy; y < gy + d; y++) for (let x = gx; x < gx + w; x++) if (x < 0 || y < 0 || x >= N || y >= N || W.occ[y][x]) return false;
  for (let y = gy; y < gy + d; y++) for (let x = gx; x < gx + w; x++) W.occ[y][x] = true;
  addObj({ t: 'b', id, gx, gy, w, d, key: gx + w + gy + d }); stats.buildings++; return true;
}
function genBuildings() {
  const G = buildingGroups(); if (!G.length) return;
  const weights = { th_tile: 2, th_flat_a: 1, th_flat_b: 1, colonial_a: 1.4, colonial_b: 1.4, low_a: 1, low_b: 1 };
  const bag = []; for (const g of G) for (let i = 0; i < (weights[g.name] || 1) * 2; i++) bag.push(g);
  for (const [bx0, bx1] of BX) for (const [by0, by1] of BY) {
    if (inRect(bx0, by0, LAKE) || inRect(bx0, by0, PLAZA)) continue;
    for (let x = bx0; x <= bx1; x++) {
      placeBuilding(pick(bag), 'back', x, by0);                                            // faces the road above: we see its rear
      const g = pick(bag), d = A.man.sprites[g.front].fp[1];
      placeBuilding(g, 'front', x, by1 - d + 1);                                          // faces the road below: we see its shopfront
    }
  }
}

// ── procedural bits: utility poles (everything else is a sprite) ──
const PROC = {};
function makePole() { const H = 118; const [c, x] = mk(23, H + 4); const cx = 11;
  px(x, cx, 8, 3, H - 8, '#8b8b86'); px(x, cx + 2, 8, 1, H - 8, '#6e6e6a'); px(x, 1, 14, 21, 2, '#55534f'); px(x, 4, 32, 15, 2, '#55534f');
  px(x, 1, 12, 2, 3, '#c9c6bd'); px(x, 20, 12, 2, 3, '#c9c6bd'); px(x, 5, 30, 2, 3, '#c9c6bd'); px(x, 16, 30, 2, 3, '#c9c6bd');
  px(x, cx - 3, 52, 8, 11, '#74746f'); px(x, cx - 3, 52, 8, 2, '#a1a19b'); px(x, cx - 3, 61, 8, 2, '#55534f');          // transformer can
  return { c, ox: cx + 1, oy: H }; }
function poleTop(p) { const [sx, sy] = proj(p.x + .5, p.y + .5); return [sx, sy - 112]; }

function genProps() {
  PROC.pole = makePole();
  const free = (x, y) => x >= 0 && y >= 0 && x < N && y < N && !W.occ[y][x];
  const side = (x, y) => /^kerb|^sidewalk/.test(W.ground[y][x]);
  const poles = [];
  for (const xr of XR) for (let x = 2; x < N - 1; x += 5) for (const [row, s] of [[xr[0] - 1, 0], [xr[1] + 1, 1]]) {
    if ((x + s * 2) % 5 !== 2 || !side(x, row) || !free(x, row) || trainAlley(x, row) || inRect(x, row, LAKE)) continue; poles.push({ x, y: row, axis: 'x', side: s }); }
  for (const yr of YR) for (let y = 2; y < N - 1; y += 5) for (const [col, s] of [[yr[0] - 1, 0], [yr[1] + 1, 1]]) {
    if ((y + s * 2) % 5 !== 2 || !side(col, y) || !free(col, y) || inRect(col, y, LAKE)) continue; poles.push({ x: col, y, axis: 'y', side: s }); }
  for (const p of poles) addObj({ t: 'p', c: PROC.pole.c, ox: PROC.pole.ox, oy: PROC.pole.oy, gx: p.x + .5, gy: p.y + .5, key: p.x + p.y + 1 });
  W.poles = poles; stats.poles = poles.length;

  const put = (id, gx, gy, key) => { if (!has(id)) return null; const m = A.man.sprites[id]; return addObj({ t: 'q', c: A.spr[id], ox: m.pivot[0], oy: m.pivot[1], gx, gy, key: key ?? gx + gy }); };
  const big = ['bang_big', 'da', 'phuong', 'bang_small'].map((n) => 'tree_' + n), small = ['bang_small', 'phuong', 'palm', 'banana', 'ficus_pot'].map((n) => 'tree_' + n);
  const t = (x, y, ids) => { put(pick(ids), x + rr(.3, .7), y + rr(.3, .7), x + y + 1); };
  const L = LAKE;
  for (let y = L.y0; y <= L.y1; y++) for (let x = L.x0; x <= L.x1; x++) if (/^grass/.test(W.ground[y][x]) && !(x >= 36 && x <= 37 && y >= 4 && y <= 5) && R() < .5) t(x, y, y < 2 || x < 32 ? big : ['tree_willow', 'tree_palm', 'tree_bang_small']);
  for (const [x, y] of [[16, 15], [23, 15], [16, 12], [23, 12], [19, 15], [21, 15], [17, 13], [22, 13]]) t(x, y, small);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (!free(x, y)) continue;
    if (/^alley/.test(W.ground[y][x]) && !trainAlley(x, y) && R() < .35) t(x, y, small);
    else if (/^(sidewalk|kerb)/.test(W.ground[y][x]) && (x * 7 + y * 13) % 11 === 0 && !trainAlley(x, y) && !poles.some((p) => Math.abs(p.x - x) + Math.abs(p.y - y) < 2)) t(x, y, small); }
  if (has('turtle_tower')) put('turtle_tower', 37, 5.2, 36 + 4 + 2);
  if (has('bridge_huc_m')) put('bridge_huc_m', 36.1, 5.95, 36 + 5 + 1);
  for (let x = 0; x <= 9; x++) for (const row of [17, 18, 20, 21]) if (R() < .42) put(pick(['prop_cafe', 'prop_cafe', 'prop_pho', 'prop_drinks', 'prop_tea']), x + rr(.3, .7), row + rr(.35, .65));
  const food = ['prop_cart', 'prop_pho', 'prop_grill', 'prop_banhmi', 'prop_fruit', 'prop_drinks', 'prop_tea', 'prop_cafe'];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (free(x, y) && /^(sidewalk|kerb)/.test(W.ground[y][x]) && !trainAlley(x, y) && !inRect(x, y, LAKE) && R() < .09) put(pick(food), x + rr(.3, .7), y + rr(.3, .7));
  for (const [x, y] of [[16, 15], [18, 15], [20, 15], [22, 15], [24, 15], [17, 14], [23, 14]]) put(pick(food), x + .5, y + .5);
  if (has('gate_oquanchuong')) { const m = A.man.sprites.gate_oquanchuong; addObj({ t: 'b', id: 'gate_oquanchuong', gx: 18, gy: 12, w: 4, d: 1, key: 18 + 4 + 12 + 1 }); }
}

// ── cables ──
function genCables() {
  const P = W.poles; const same = (a, b) => a.axis === b.axis && a.side === b.side && (a.axis === 'x' ? a.y === b.y : a.x === b.x);
  for (const a of P) {
    let best = null, bd = 1e9;
    for (const b of P) { if (!same(a, b)) continue; const d = a.axis === 'x' ? b.x - a.x : b.y - a.y; if (d > 0 && d < bd) { bd = d; best = b; } }
    if (best && bd <= 6) for (let s = 0; s < 4; s++) W.cables.push({ a, b: best, off: s, kind: 'run' });
    for (const b of P) if (a.axis === b.axis && a.side === 0 && b.side === 1 && (a.axis === 'x' ? a.x === b.x : a.y === b.y)) for (let s = 0; s < 2; s++) W.cables.push({ a, b, off: s, kind: 'cross' });
  }
  for (let x = 1; x <= 9; x += 2) W.cables.push({ pa: [x + .5, 17.5], pb: [x + .5, 21.5], h: 64, kind: 'lantern', sag: 6 });
  stats.cables = W.cables.length;
}
function drawCable(g, c, ox, oy) {
  let A_, B_, sag, col = '#16171b';
  if (c.kind === 'lantern') { A_ = proj(c.pa[0], c.pa[1]); A_ = [A_[0], A_[1] - c.h]; B_ = proj(c.pb[0], c.pb[1]); B_ = [B_[0], B_[1] - c.h]; sag = c.sag * 2; col = '#2b2420'; }
  else { A_ = poleTop(c.a); B_ = poleTop(c.b); const dy = c.off * 4 + (c.kind === 'cross' ? 1 : 0); A_[0] += (c.off % 2) * 2 - 1; B_[0] += (c.off % 2) * 2 - 1; A_[1] += dy; B_[1] += dy; sag = Math.hypot(B_[0] - A_[0], B_[1] - A_[1]) * (c.kind === 'cross' ? .07 : .09); }
  const n = Math.ceil(Math.hypot(B_[0] - A_[0], B_[1] - A_[1])); g.fillStyle = col; let lx = -1e9, ly = -1e9;
  for (let i = 0; i <= n; i++) { const t = i / n; const X = Math.round(A_[0] + (B_[0] - A_[0]) * t + ox), Y = Math.round(A_[1] + (B_[1] - A_[1]) * t + sag * 4 * t * (1 - t) + oy);
    if (X !== lx || Y !== ly) { g.fillRect(X, Y, 1, 1); lx = X; ly = Y; }
    if (c.kind === 'lantern' && i % Math.max(8, (n / 6) | 0) === 4) { g.fillStyle = (i >> 3) % 2 ? '#e8b030' : '#d23a2a'; g.fillRect(X - 2, Y + 1, 5, 6); g.fillStyle = '#7a1e14'; g.fillRect(X - 2, Y + 6, 5, 1); g.fillStyle = col; } }
}
function drawTangles(g, ox, oy) {
  g.fillStyle = '#16171b';
  for (const p of W.poles) { if (((p.x * 31 + p.y * 17) & 3) !== 0) continue; const [sx, sy] = poleTop(p); const r = rng(p.x * 100 + p.y);
    for (let i = 0; i < 20; i++) { const a = r() * 6.28; g.fillRect(Math.round(sx + Math.cos(a) * 6 * r() + ox), Math.round(sy + 12 + Math.sin(a) * 4 * r() + oy), 1, 1 + (r() > .7)); } }
}

// ── traffic ──
const CARS = [['car', 5], ['taxi', 5], ['bus', 1], ['truck', 2]];
function genVehicles() {
  const v = W.vehicles;
  const lane = (axis, r0, [a, b], n) => { for (let i = 0; i < n; i++) {
    const fwd = R() < .5, along = rr(a, b);
    const isCar = R() < .16; let kind = 'moto', name = pick(MOTO), sp = rr(1.0, 2.2), across = fwd ? r0 + rr(1.55, 2.75) : r0 + rr(.25, 1.4);
    if (isCar) { const bag = []; for (const [n_, w_] of CARS) for (let k = 0; k < w_; k++) bag.push(n_); name = pick(bag); kind = 'car'; sp = name === 'bus' ? rr(.7, 1.0) : rr(.9, 1.5); across = fwd ? r0 + rr(1.9, 2.3) : r0 + rr(.6, 1.0); }
    v.push({ axis, kind, dir: (fwd ? '+' : '-') + axis, a, b, name, sp: sp * (fwd ? 1 : -1), wob: R() * 6.28, along, across }); } };
  for (const r of XR) lane('x', r[0], ROAD_SPAN.x[r[0]] || [0, N], 24);
  for (const r of YR) lane('y', r[0], ROAD_SPAN.y[r[0]] || [0, N], 24);
  W.train = { x: -9, dir: 1, sp: 1.7, wait: 3 };
}
function stepVehicles(dt) {
  for (const v of W.vehicles) { v.along += v.sp * dt; if (v.along > v.b + 1) v.along = v.a - 1; if (v.along < v.a - 1) v.along = v.b + 1; }
  const t = W.train; if (t.wait > 0) { t.wait -= dt; return; }
  t.x += t.sp * dt; if (t.x > RAIL.x1 + 9) { t.wait = 6; t.x = -9; }                  // one-way run: only the down-right sprite exists
}
function vehicleSprite(v) {
  const fwd = v.dir[0] === '+', axis = v.dir[1], base = v.kind === 'car' ? (fwd ? `car_t_${v.name}` : `car_a_${v.name}`) : (fwd ? `moto_t_${v.name}` : `moto_a_${v.name}`);
  const id = axis === 'x' ? base : base + '_m';
  return has(id) ? { c: A.spr[id], ox: A.man.sprites[id].pivot[0], oy: A.man.sprites[id].pivot[1] } : null;
}

// ── fallback iso box (no antialiasing) ──
function isoBox(o, ox, oy) {
  const [Lx, Ly] = proj(o.gx, o.gy + o.d), [Bx, By] = proj(o.gx + o.w, o.gy + o.d), [Rx, Ry] = proj(o.gx + o.w, o.gy), [Tx, Ty] = proj(o.gx, o.gy);
  const [cl, cr, ct] = o.col, wl = Bx - Lx, wr = Rx - Bx;
  for (let i = 0; i < wl; i++) { const yb = Ly + Math.floor(i * (By - Ly) / wl); px(ctx, Lx + i + ox, yb - o.h + oy, 1, o.h, cl); }
  for (let i = 0; i < wr; i++) { const yb = By + Math.floor(i * (Ry - By) / wr); px(ctx, Bx + i + ox, yb - o.h + oy, 1, o.h, cr); }
  for (let X = Lx; X <= Rx; X++) { const up = X <= Tx ? Ly + (Ty - Ly) * (X - Lx) / (Tx - Lx || 1) : Ty + (Ry - Ty) * (X - Tx) / (Rx - Tx || 1);
    const dn = X <= Bx ? Ly + (By - Ly) * (X - Lx) / (Bx - Lx || 1) : By + (Ry - By) * (X - Bx) / (Rx - Bx || 1);
    px(ctx, X + ox, Math.round(up) - o.h + oy, 1, Math.max(1, Math.round(dn - up)), ct); }
}
function drawTrain(o, ox, oy) {
  if (has('train_loco')) { for (const [id, k] of [['train_loco', 0], ['train_car', 1]]) if (has(id)) { const m = A.man.sprites[id]; const [sx, sy] = proj(o.gx - k * 3.9, o.gy); ctx.drawImage(A.spr[id], Math.round(sx - m.pivot[0] + ox), Math.round(sy - m.pivot[1] + oy)); } return; }
  for (let i = 0; i < 3; i++) { const gx = o.gx - i * 2.6; const [sx, sy] = proj(gx, o.gy);
    isoBox({ gx: gx - 1.2, gy: o.gy - .4, w: 2.4, d: .8, h: 34, col: i === 0 ? ['#2f5fa8', '#244a85', '#3b72c4'] : ['#e8e4d8', '#c9c5b8', '#f4f1e8'] }, ox, oy); px(ctx, Math.round(sx + ox - 20), Math.round(sy + oy - 16), 40, 3, '#e3b53a'); }
}

// ───────────────────────── static layers (ground + cables rendered once) ─────────────────────────
const LAY = { ground: null, cables: null, ox: 0, oy: 0 };
function buildLayers() {
  const minX = -(N - 1) * TW / 2 - TW / 2, maxX = (N - 1) * TW / 2 + TW / 2, minY = -330, maxY = (2 * N - 2) * TH / 2 + TH + 60;
  LAY.ox = -minX; LAY.oy = -minY; const w = Math.ceil(maxX - minX), h = Math.ceil(maxY - minY);
  const [gc, gg] = mk(w, h), [cc, cg] = mk(w, h);
  for (let s = 0; s < 2 * N - 1; s++) for (let y = 0; y < N; y++) { const x = s - y; if (x < 0 || x >= N) continue; const [sx, sy] = proj(x, y); gg.drawImage(tile(W.ground[y][x]), Math.round(sx - TW / 2 + LAY.ox), Math.round(sy + LAY.oy)); }
  for (const c of W.cables) drawCable(cg, c, LAY.ox, LAY.oy); drawTangles(cg, LAY.ox, LAY.oy);
  LAY.ground = gc; LAY.cables = cc;
}

// ───────────────────────── render ─────────────────────────
function frame(t0, now) {
  const dt = Math.min(.05, (now - t0) / 1000); stepVehicles(dt);
  const z = cam.zoom, w = Math.ceil(innerWidth / z), h = Math.ceil(innerHeight / z);
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  ctx.imageSmoothingEnabled = false; ctx.fillStyle = '#1b1d23'; ctx.fillRect(0, 0, w, h);
  const ox = Math.round(w / 2 - cam.x), oy = Math.round(h / 2 - cam.y);
  { const sx0 = Math.round(-ox + LAY.ox), sy0 = Math.round(-oy + LAY.oy); ctx.drawImage(LAY.ground, sx0, sy0, w, h, 0, 0, w, h); }
  const list = [...W.objs];
  for (const v of W.vehicles) { const ms = vehicleSprite(v); if (!ms) continue; const sw = Math.sin(now / 900 + v.wob) * .05;
    const gx = v.axis === 'x' ? v.along : v.across + sw, gy = v.axis === 'x' ? v.across + sw : v.along;
    list.push({ t: 'v', c: ms.c, ox: ms.ox, oy: ms.oy, gx, gy, key: gx + gy }); }
  const tr = W.train; if (tr) list.push({ t: 'train', gx: tr.x, gy: RAIL.row + .5, key: tr.x + RAIL.row + .5 + 1.9 });
  list.sort((a, b) => a.key - b.key);
  stats.objects = list.length; stats.vehicles = W.vehicles.length;
  for (const o of list) {
    { const [cx_, cy_] = proj(o.gx + (o.w || 0), o.gy + (o.d || 0)); const X_ = cx_ + ox, Y_ = cy_ + oy; if (X_ < -400 || X_ > w + 400 || Y_ < -80 || Y_ > h + 420) continue; }
    if (o.t === 'b') { const m = A.man.sprites[o.id], [bx, by] = proj(o.gx + o.w, o.gy + o.d); ctx.drawImage(A.spr[o.id], Math.round(bx - m.pivot[0] + ox), Math.round(by - m.pivot[1] + oy)); }
    else if (o.t === 'box') isoBox(o, ox, oy);
    else if (o.t === 'train') drawTrain(o, ox, oy);
    else { const [sx, sy] = proj(o.gx, o.gy); ctx.drawImage(o.c, Math.round(sx - (o.ox ?? 0) + ox), Math.round(sy - (o.oy ?? 0) + oy)); }
  }
  { const sx0 = Math.round(-ox + LAY.ox), sy0 = Math.round(-oy + LAY.oy); ctx.drawImage(LAY.cables, sx0, sy0, w, h, 0, 0, w, h); }
  if (tod) { ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = TOD_TINT[tod]; ctx.fillRect(0, 0, w, h); ctx.globalCompositeOperation = 'source-over'; }
  stats.fps = Math.round(1000 / Math.max(1, now - t0));
  hud.textContent = `Hà Nội Pixel Map  ${N}x${N}  tile ${TW}x${TH}  [${ROOT}]\nsprites ${stats.sprites}/${stats.spritesWanted}  buildings ${stats.buildings}  objs ${stats.objects}  poles ${stats.poles}  cables ${stats.cables}\nzoom ${cam.zoom}x  fps ${stats.fps}  [drag/WASD pan · wheel zoom · T time of day · H hide]`;
}

// ───────────────────────── input & boot ─────────────────────────
let drag = null; const keys = new Set();
cv.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y }; cv.classList.add('drag'); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', (e) => { if (drag) { cam.x = drag.cx - (e.clientX - drag.x) / cam.zoom; cam.y = drag.cy - (e.clientY - drag.y) / cam.zoom; } });
cv.addEventListener('pointerup', () => { drag = null; cv.classList.remove('drag'); });
cv.addEventListener('wheel', (e) => { e.preventDefault(); { const ZS = [0.5, 1, 2, 3, 4]; let i = ZS.indexOf(cam.zoom); if (i < 0) i = 1; cam.zoom = ZS[Math.max(0, Math.min(ZS.length - 1, i + (e.deltaY < 0 ? 1 : -1)))]; } }, { passive: false });
addEventListener('keydown', (e) => { keys.add(e.key.toLowerCase()); if (e.key === 't' || e.key === 'T') tod = (tod + 1) % 3; if (e.key === 'h' || e.key === 'H') hud.style.display = hud.style.display === 'none' ? '' : 'none'; });
addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
window.setCam = (x, y, z) => { cam.x = x; cam.y = y; if (z) cam.zoom = z; };
window.setTod = (v) => { tod = v; };
window.gridToWorld = (gx, gy) => proj(gx, gy);
window.addEventListener('error', (e) => stats.errors.push(String(e.message)));

(async function boot() {
  await loadAssets(); genGround(); genBuildings(); genProps(); genCables(); genVehicles(); buildLayers();
  const [cx, cy] = proj(N / 2, N / 2); cam.x = cx; cam.y = cy; window.__ready = true;
  let last = performance.now();
  (function loop(now) {
    const s = 12 / cam.zoom * 3; if (keys.has('w') || keys.has('arrowup')) cam.y -= s; if (keys.has('s') || keys.has('arrowdown')) cam.y += s; if (keys.has('a') || keys.has('arrowleft')) cam.x -= s; if (keys.has('d') || keys.has('arrowright')) cam.x += s;
    try { frame(last, now); } catch (e) { stats.errors.push(String(e.stack || e)); hud.textContent = 'error: ' + e.message; return; }
    last = now; requestAnimationFrame(loop);
  })(last);
})();
</script>
</body>
