<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hà Nội Pixel</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1d23; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; cursor: pointer; touch-action: none; }
  #hud { position: fixed; left: 8px; top: 8px; z-index: 4; color: #f4efe2; font: 12px/1.35 ui-monospace, Consolas, monospace; white-space: pre; background: rgba(14, 15, 19, .72); padding: 6px 9px; border-radius: 5px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">đang tải…</div>
<script src="js/player.js?v=8"></script>
<script src="js/world.js?v=12"></script>
<script>
(async () => {
  try { await World.load(); World.generate(); World.start(document.getElementById('c'), document.getElementById('hud')) }
  catch (e) { document.getElementById('hud').textContent = 'lỗi: ' + (e.stack || e); (window.__stats ||= { errors: [] }).errors.push(String(e.stack || e)) }
})()
</script>
</body>
</html>
